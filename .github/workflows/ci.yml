name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 编译三个 bootloader 工程，确认核心代码不破
  # ============================================================
  build-f407:
    name: Build STM32F407 bootloader
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (cmake + ninja)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install ARM GCC toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.2.rel1'

      - name: Verify toolchain
        run: |
          which cmake
          which ninja
          which arm-none-eabi-gcc
          cmake --version
          ninja --version
          arm-none-eabi-gcc --version

      - name: Verify toolchain file exists
        working-directory: projects/stm32f407
        run: ls -la cmake/gcc-arm-none-eabi.cmake

      - name: Configure
        working-directory: projects/stm32f407
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/gcc-arm-none-eabi.cmake

      - name: Build
        working-directory: projects/stm32f407
        run: cmake --build build

      - name: Check bootloader size constraint
        working-directory: projects/stm32f407
        run: |
          SIZE=$(stat -c%s build/MCU_BOOT.bin)
          echo "bootloader size: ${SIZE} bytes"
          test "$SIZE" -lt 49152 || { echo "bootloader exceeds 48KB quota"; exit 1; }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stm32f407-bootloader
          path: |
            projects/stm32f407/build/MCU_BOOT.elf
            projects/stm32f407/build/MCU_BOOT.bin
            projects/stm32f407/build/MCU_BOOT.hex
            projects/stm32f407/build/MCU_BOOT.map
          if-no-files-found: warn

  build-f103:
    name: Build STM32F103 bootloader
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (cmake + ninja)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install ARM GCC toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.2.rel1'

      - name: Verify toolchain
        run: |
          which cmake
          which ninja
          which arm-none-eabi-gcc
          cmake --version
          ninja --version
          arm-none-eabi-gcc --version

      - name: Verify toolchain file exists
        working-directory: projects/stm32f103
        run: ls -la cmake/gcc-arm-none-eabi.cmake

      - name: Configure
        working-directory: projects/stm32f103
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/gcc-arm-none-eabi.cmake

      - name: Build
        working-directory: projects/stm32f103
        run: cmake --build build

      - name: Check bootloader size constraint
        working-directory: projects/stm32f103
        run: |
          SIZE=$(stat -c%s build/MCU_BOOT.bin)
          echo "bootloader size: ${SIZE} bytes"
          test "$SIZE" -lt 24576 || { echo "bootloader exceeds 24KB quota"; exit 1; }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stm32f103-bootloader
          path: |
            projects/stm32f103/build/MCU_BOOT.elf
            projects/stm32f103/build/MCU_BOOT.bin
            projects/stm32f103/build/MCU_BOOT.hex
            projects/stm32f103/build/MCU_BOOT.map
          if-no-files-found: warn

  build-hc32:
    name: Build HC32F460 bootloader
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (cmake + ninja)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install ARM GCC toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.2.rel1'

      - name: Verify toolchain
        run: |
          which cmake
          which ninja
          which arm-none-eabi-gcc
          cmake --version
          ninja --version
          arm-none-eabi-gcc --version

      - name: Verify toolchain file exists
        working-directory: projects/hc32f460/boot
        run: ls -la cmake/gcc-hc32f460.cmake

      - name: Configure
        working-directory: projects/hc32f460/boot
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/gcc-hc32f460.cmake

      - name: Build
        working-directory: projects/hc32f460/boot
        run: cmake --build build

      - name: Check bootloader size constraint
        working-directory: projects/hc32f460/boot
        run: |
          SIZE=$(stat -c%s build/hc32_boot.bin)
          echo "bootloader size: ${SIZE} bytes"
          test "$SIZE" -lt 49152 || { echo "bootloader exceeds 48KB quota"; exit 1; }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hc32f460-bootloader
          path: |
            projects/hc32f460/boot/build/hc32_boot.elf
            projects/hc32f460/boot/build/hc32_boot.bin
            projects/hc32f460/boot/build/hc32_boot.hex
            projects/hc32f460/boot/build/hc32_boot.map
          if-no-files-found: warn

  # ============================================================
  # 签名工具冒烟测试
  # ============================================================
  sign-tool-smoke:
    name: Sign tool smoke test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ecdsa
        run: pip install ecdsa

      - name: Generate keys + sign dummy firmware
        working-directory: tool/sign_tool
        run: |
          python generate_keys.py --outdir /tmp/keys
          python -c "open('/tmp/app.bin','wb').write(b'\\xAA' * 1024)"
          python sign_firmware.py /tmp/app.bin \
            --key /tmp/keys/private_key.pem \
            --version 1.0.0 \
            --addr 0x08010000 \
            --out /tmp/app_signed.bin

          python -c "
          import struct, binascii
          with open('/tmp/app_signed.bin', 'rb') as f:
              data = f.read()
          magic = struct.unpack('<I', data[0:4])[0]
          assert magic == 0x4D414749, f'bad magic: {magic:#x}'
          hdr_crc = struct.unpack('<I', data[248:252])[0]
          calc    = binascii.crc32(data[0:248]) & 0xFFFFFFFF
          assert hdr_crc == calc, f'header CRC mismatch: {hdr_crc:#x} vs {calc:#x}'
          print(f'signed image OK: {len(data)} bytes, magic=MAGI, header CRC verified')
          "
